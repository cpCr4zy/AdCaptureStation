name: publish-scan

# The gate has to run somewhere other than the author's shell, otherwise it is a habit, not a check.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      # both must be public: the handle you are willing to publish, and a no-reply address
      ALLOWED_AUTHOR_NAME: cpCr4zy
      ALLOWED_AUTHOR_EMAIL_SUFFIX: "@users.noreply.github.com"   # 5735197+cpCr4zy@…
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0          # full history: gitleaks and the author check need it

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.x"

      - name: Pre-publication audit (secrets, identifiers, binaries, git state)
        run: bash scripts/publish_scan.sh

      - name: Secret scan over history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit identity is public-safe
        run: |
          set -euo pipefail
          echo "authors in history:"
          git log --format='%an <%ae>' | sort -u
          bad=0
          while IFS= read -r line; do
            name=${line%% <*}; email=${line##*<}; email=${email%>}
            # GitHub's own bots (Dependabot, Actions) are public identities by construction;
            # match the exact <id>+<name>[bot]@users.noreply.github.com form, nothing looser
            if [[ "$name" =~ ^[a-z0-9-]+\[bot\]$ && "$email" == +([0-9])+"$name"@users.noreply.github.com ]]; then
              continue
            fi
            if [ "$name" != "$ALLOWED_AUTHOR_NAME" ] || [ "${email%$ALLOWED_AUTHOR_EMAIL_SUFFIX}" = "$email" ]; then
              echo "::error::commit identity is not the public one: $line"
              bad=1
            fi
          done < <(git log --format='%an <%ae>' | sort -u)
          exit "$bad"

      - name: No rig artefacts in history
        run: |
          set -euo pipefail
          if git log --all --diff-filter=A --name-only --pretty=format: \
             | sort -u | grep -E '^(private|captured|adcapture|playable|mitmconf|all|century|flows)/|\.(pem|p12|pfx|key)$|(^|/)(adbkey|adbkey\.pub)$'; then
            echo "::error::a capture, key or transcript is in the history"
            exit 1
          fi

# Note: every action above is pinned to a commit SHA (tag in the comment); Dependabot
# (.github/dependabot.yml) proposes the bumps as pull requests.
