# Version updates as pull requests. Actions are pinned by SHA in the workflow; Dependabot keeps the
# SHA and the version comment in step. The pip files are the two rig venvs (reference pins).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /config
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # requirements-mitmvenv.txt is mitmproxy's resolved dependency set, and mitmproxy pins most of
    # it with hard upper bounds (aioquic ==, urwid/tornado/asgiref/cryptography <=). Bumping one of
    # those alone makes the file uninstallable, and CI does not install it, so the PR would still
    # be green. Version updates are therefore limited to mitmproxy itself (move its dependencies
    # in the same PR, by hand) and the bot venv. cryptography is shared and capped by mitmproxy.
    # Security updates are not affected by this list.
    allow:
      - dependency-name: mitmproxy
      - dependency-name: certifi
      - dependency-name: cffi
      - dependency-name: charset-normalizer
      - dependency-name: idna
      - dependency-name: numpy
      - dependency-name: opencv-python-headless
      - dependency-name: pillow
      - dependency-name: protobuf
      - dependency-name: pycparser
      - dependency-name: requests
      - dependency-name: urllib3
